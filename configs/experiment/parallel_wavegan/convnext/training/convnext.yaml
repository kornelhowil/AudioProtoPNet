# @package _global_
defaults:
  - override /datamodule: deepfake.yaml
  - override /module: multilabel.yaml
  - override /module/network: convnext.yaml
  - override /callbacks: default.yaml
  - override /trainer: single_gpu.yaml
  - override /datamodule/transforms: bird_default_multilabel.yaml
  - override /paths: default.yaml
  - override /hydra: default.yaml

task_name: "parallel_wavegan_convnext"
tags: ["parallel_wavegan", "DeepFake", "convnext"]
seed: 42
train: True
test: False

logger:
  wandb:
    tags: ${tags}
    group: "parallel_wavegan_convnext"
    mode: online

trainer:
  min_epochs: 1
  max_epochs: 10

datamodule:
  dataset:
    hf_name: ljspeech_parallel_wavegan # Default wavefake method
  transforms:
    preprocessing:
      mean: -13.369 # Mean of XCL
      std: 13.162 # Standard deviation of XCL